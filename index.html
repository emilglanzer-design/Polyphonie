<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KWARTET · start</title>
<link rel="stylesheet" href="te-glas.css">
<style>
/* Startpagina: kop, 4x2 tegels, onderbalk met de bediening van de gekozen app. */
.pagina{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:16px;padding:18px 22px 20px 22px}

/* ---- kop ---- */
.kopbalk{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:12px 18px}
.merk{display:flex;align-items:baseline;gap:12px}
.merk .woord{font:800 30px/1 var(--f);letter-spacing:-.03em}
.merk .woord span{color:var(--oranje)}
.merk .sub{font:500 10.5px var(--m);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kastjes{display:flex;justify-content:center;gap:10px}
.kastje{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 10px;border-radius:999px;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.7);font:600 11px var(--m);letter-spacing:.1em;transition:background .2s}
.kastje .led{--k:var(--kk)}
.kastje small{font:500 10px var(--m);color:var(--muted);letter-spacing:.08em}
.kastje.aan{background:rgba(255,255,255,.75)}
.kastje.puls{animation:puls .35s ease-out}
@keyframes puls{0%{transform:scale(1.07)}100%{transform:scale(1)}}
.rechts{display:flex;align-items:center;gap:16px}
.midi{display:flex;align-items:center;gap:8px;font:600 10.5px var(--m);letter-spacing:.12em;text-transform:uppercase}
.klok{font:700 22px/1 var(--m);letter-spacing:.02em;min-width:72px;text-align:right}

/* ---- tegels ---- */
.raster{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:16px;min-height:0}
.tegel{display:grid;grid-template-rows:auto 1fr auto;padding:16px 18px 16px 18px;text-decoration:none;color:inherit;cursor:pointer;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s,box-shadow .22s;outline:none}
.tegel:hover{background:rgba(255,255,255,.55)}
.tegel .rij1{display:flex;justify-content:space-between;align-items:center}
.tegel .nr{font:700 13px var(--m)}
.tag{font:600 9.5px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:999px;border:1px solid var(--hair-2);background:rgba(255,255,255,.4)}
.tegel .beeld{display:grid;place-items:center;min-height:0}
.tegel .beeld svg{width:min(78%,230px);height:auto;max-height:100%;overflow:visible}
.tegel .beeld svg *{vector-effect:non-scaling-stroke}
.tegel h2{font:800 clamp(22px,2.1vw,32px)/1 var(--f);letter-spacing:-.025em;margin:0 0 6px}
.tegel p{margin:0;font-size:13.5px;line-height:1.35;color:var(--ink-2);min-height:2.7em}
.tegel .voet{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--hair)}
.tegel .voet span{font:500 10px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tegel .voet .open{color:var(--ink);font-weight:700}
.tegel.binnenkort .beeld,.tegel.concept .beeld{opacity:.45}
.tegel.binnenkort .tag,.tegel.concept .tag{border-style:dashed}
.tegel.gekozen{transform:translateY(-6px) scale(1.015);background:rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 #fff,0 0 0 2.5px var(--kies,var(--oranje)),0 34px 70px -28px rgba(0,0,0,.45)}
.tegel.gekozen .voet .open{color:var(--oranje)}
.tegel.gekozen .beeld svg .acc{animation:knipper 1.4s steps(2,jump-none) infinite}
@keyframes knipper{50%{opacity:.35}}
.tegel.schud{animation:schud .4s}
@keyframes schud{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.wijzer{position:absolute;top:12px;right:12px;display:none}

/* ---- onderbalk ---- */
.onder{display:grid;grid-template-columns:minmax(220px,1.1fr) 3.6fr auto;gap:22px;align-items:stretch;padding:14px 18px}
.gekozen-info{display:grid;align-content:center;gap:4px}
.gekozen-info .groot{font:800 22px/1 var(--f);letter-spacing:-.02em}
.bediening{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ctl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.7)}
.ctl svg{grid-row:span 2;width:30px;height:30px}
.ctl .wat{font:600 9.5px var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ctl .doet{font:600 13px/1.2 var(--f)}
.terug{display:grid;align-content:center;gap:6px;font:500 10.5px var(--m);letter-spacing:.06em;color:var(--ink-2);white-space:nowrap}
.terug div{display:flex;align-items:center;gap:6px}
.melding{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:30;padding:10px 16px;font:600 12px var(--m);letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .25s;pointer-events:none}
.melding.aan{opacity:1}
@media (max-height:820px){.tegel p{display:none}.onder{padding:10px 14px}}
</style>
</head>
<body>
<div class="te-achtergrond"><i></i><i></i><i></i><i></i></div>

<div class="pagina">
  <header class="kopbalk glas">
    <div class="merk"><div class="woord">KWAR<span>T</span>ET</div><div class="sub">ontwerpkastjes · mvi</div></div>
    <div class="kastjes" id="kastjes"></div>
    <div class="rechts">
      <div class="midi"><span class="led" id="midiLed"></span><span id="midiTekst">toetsenbord</span></div>
      <div class="klok" id="klok">--:--</div>
    </div>
  </header>

  <main class="raster" id="raster"></main>

  <footer class="onder glas">
    <div class="gekozen-info">
      <div class="label" id="gNr">01 / 08</div>
      <div class="groot" id="gNaam">Poster</div>
      <div class="label" id="gStatus">druk de joystick in om te openen</div>
    </div>
    <div class="bediening" id="bediening"></div>
    <div class="terug">
      <div><span class="kap">joy</span> kiezen</div>
      <div><span class="kap oranje">druk</span> openen</div>
      <div><span class="kap">esc</span> of <span class="kap">1</span>+<span class="kap">2</span> vast = terug</div>
    </div>
  </footer>
</div>
<div class="melding glas sterk" id="melding"></div>

<script src="kastjes.js"></script>
<script>
(function () {
  'use strict';
  var KLEUR = { 1: '#ff7a1a', 2: '#3b8bff', 3: '#21c06b', 4: '#b768ff' };

  // ---------- de apps ----------
  // status: 'klaar' (te openen), 'binnenkort' (wordt gebouwd), 'concept' (alleen op papier)
  // b = bediening: joystick, knop links, knop rechts, toets 1, toets 2
  var APPS = [
    { id: 'poster', naam: 'Poster', tag: 'ontwerp', href: 'apps/poster.html', status: 'klaar', spelers: '1–4', tijd: '20 min',
      tekst: 'Samen één poster maken. Ieder een rol: kleur, typografie, layout of beeld.',
      b: ['naar een element · druk = pakken', 'eigenschap kiezen', 'waarde draaien', 'bevriezen · vast = ruilen', 'ik ben klaar'] },
    { id: 'caleidoscoop', naam: 'Caleidoscoop', tag: 'kunst', href: 'apps/caleidoscoop.html', status: 'klaar', spelers: '1–4', tijd: '10 min',
      tekst: 'Teken samen, acht keer gespiegeld. Je ledstrip kleurt mee met je penseel.',
      b: ['bewegen · druk = pen neer', 'grootte · druk = penseel', 'kleur', 'aantal spiegels', '2 sec vast = doek leeg'] },
    { id: 'ritme', naam: 'Ritmebox', tag: 'muziek', href: 'apps/ritme.html', status: 'klaar', spelers: '1–4', tijd: '15 min',
      tekst: 'Ieder speelt één spoor van een drumcomputer. Samen bouw je een beat.',
      b: ['stap en spoor · druk = aan/uit', 'toonhoogte', 'volume · ingedrukt: tempo', 'andere klank', 'start/stop · lang: spoor leeg'] },
    { id: 'etsen', naam: 'Etsmachine', tag: 'samenwerken', href: 'apps/etsen.html', status: 'klaar', spelers: '1–4', tijd: '15 min',
      tekst: 'Eén pen, vier handen. De een stuurt links-rechts, de ander op-neer. Teken de opdracht.',
      b: ['sturen (als dat je taak is)', 'je tweede taak', 'je eerste taak', 'volgende opdracht', 'taken doorschuiven'] },
    { id: 'standpunt', naam: 'Standpunt', tag: 'gesprek', href: 'apps/standpunt.html', status: 'klaar', spelers: '1–4', tijd: '20 min',
      tekst: 'Zet je stip bij een stelling. Pas als iedereen klaar is, zie je elkaars mening.',
      b: ['stip verschuiven', 'hoe zeker ben je', 'andere stelling', 'blind of open', 'klaar · 1 kastje: doorgeven'] },
    { id: 'pot', naam: 'De Pot', tag: 'burgerschap', href: 'apps/pot.html', status: 'klaar', spelers: '1–4', tijd: '15 min',
      tekst: 'Pak uit de gedeelde hotspot. Pakt de groep te veel, dan is hij voor iedereen leeg.',
      b: ['—', '—', 'pakken: tel je klikken', 'opnieuw kiezen', 'vastzetten · 1 kastje: doorgeven'] },
    { id: 'schoolplein', naam: 'Schoolplein', tag: 'ontwerp', href: 'apps/schoolplein.html', status: 'klaar', spelers: '1–4', tijd: '30 min',
      tekst: 'Richt het plein van de Eltensestraat in. Bankjes, bomen, veld: let op het budget.',
      b: ['lopen · druk = plaatsen/pakken', 'onderdeel · druk = soort', 'draaien · druk = kwartslag', 'weghalen', 'ongedaan maken'] },
    { id: 'gemeenteraad', naam: 'Gemeenteraad', tag: 'burgerschap', href: '', status: 'concept', spelers: '4', tijd: '50 min',
      tekst: 'Verdeel samen het budget van het dorp. Ieder heeft een achterban.',
      b: ['stemmen', 'post kiezen', 'bedrag', 'eis', 'ter stemming'] }
  ];

  var STATUS_TEKST = { klaar: 'open', binnenkort: 'in de maak', concept: 'concept' };

  // ---------- pictogrammen (lijntekening + oranje accent) ----------
  var S = 'fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  var BEELD = {
    poster: '<svg viewBox="0 0 160 120"><rect x="48" y="8" width="64" height="104" rx="3" ' + S + '/><circle class="acc" cx="80" cy="44" r="18" fill="#ff5a00"/>' +
      '<path d="M58 76h44M58 86h30M58 96h38" ' + S + '/><rect x="36" y="20" width="10" height="10" fill="#3b8bff"/><rect x="114" y="66" width="10" height="10" fill="#21c06b"/></svg>',
    caleidoscoop: (function () {
      var p = '';
      for (var i = 0; i < 8; i++) {
        var a = i * Math.PI / 4, x = 80 + Math.cos(a) * 50, y = 60 + Math.sin(a) * 50, x2 = 80 + Math.cos(a + .35) * 30, y2 = 60 + Math.sin(a + .35) * 30;
        p += '<path d="M80 60L' + x.toFixed(1) + ' ' + y.toFixed(1) + 'L' + x2.toFixed(1) + ' ' + y2.toFixed(1) + 'Z" ' + S + '/>';
      }
      return '<svg viewBox="0 0 160 120">' + p + '<circle class="acc" cx="80" cy="60" r="8" fill="#ff5a00"/></svg>';
    })(),
    ritme: (function () {
      var p = '', aan = ['1000100010001000', '0000100000001000', '1010101010101010', '1001001000100100'];
      for (var r = 0; r < 4; r++) for (var c = 0; c < 16; c++) {
        var x = 12 + c * 8.6, y = 22 + r * 20, on = aan[r][c] === '1';
        p += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="6.4" height="14" rx="1.5" ' +
          (on ? 'fill="' + (c === 4 ? '#ff5a00' : '#111') + '"' + (c === 4 ? ' class="acc"' : '') : 'fill="none" stroke="#111" stroke-width="1.2"') + '/>';
      }
      return '<svg viewBox="0 0 160 120">' + p + '<path d="M48 12v100" stroke="#ff5a00" stroke-width="2"/></svg>';
    })(),
    etsen: '<svg viewBox="0 0 160 120"><rect x="10" y="10" width="140" height="80" rx="8" ' + S + '/>' +
      '<path d="M30 70h22v-30h26v20h18v-30h30" ' + S + '/><circle class="acc" cx="126" cy="30" r="4" fill="#ff5a00"/>' +
      '<circle cx="28" cy="106" r="9" ' + S + '/><path d="M28 106l5-5" ' + S + '/><circle cx="132" cy="106" r="9" ' + S + '/><path d="M132 106l-5-5" ' + S + '/></svg>',
    standpunt: '<svg viewBox="0 0 160 120"><path d="M80 8v104M20 60h120" ' + S + '/><path d="M20 60l6-4M20 60l6 4M140 60l-6-4M140 60l-6 4" ' + S + '/>' +
      '<circle cx="104" cy="34" r="7" fill="#ff7a1a"/><circle cx="54" cy="44" r="7" fill="#3b8bff"/><circle cx="116" cy="82" r="7" fill="#21c06b"/><circle cx="92" cy="50" r="7" fill="#b768ff"/>' +
      '<circle class="acc" cx="104" cy="34" r="12" fill="none" stroke="#ff5a00" stroke-width="2"/></svg>',
    pot: '<svg viewBox="0 0 160 120"><path d="M56 22h48M60 22c-14 14-16 30-16 46 0 26 16 42 36 42s36-16 36-42c0-16-2-32-16-46" ' + S + '/>' +
      '<path d="M48 76c10 4 22 4 32 0s22-4 32 0" ' + S + '/><path class="acc" d="M47 80c10 4 22 4 33 0s22-4 33 0c0 18-14 28-33 28s-33-10-33-28z" fill="#ff5a00" stroke="none"/>' +
      '<path d="M30 30l8 8M130 30l-8 8M80 4v10" ' + S + '/></svg>',
    schoolplein: '<svg viewBox="0 0 160 120"><path d="M10 14h120l20 30v62H10z" ' + S + '/><rect x="24" y="30" width="62" height="40" ' + S + '/><path d="M55 30v40" ' + S + '/><circle cx="55" cy="50" r="7" ' + S + '/>' +
      '<circle class="acc" cx="112" cy="40" r="11" fill="#21c06b"/><circle cx="128" cy="62" r="8" fill="#21c06b" opacity=".7"/><rect x="100" y="84" width="34" height="8" rx="2" fill="#ff5a00"/>' +
      '<path d="M24 88h56" stroke="#111" stroke-width="2" stroke-dasharray="4 4"/></svg>',
    gemeenteraad: (function () {
      var p = '', kl = ['#ff7a1a', '#3b8bff', '#21c06b', '#b768ff'];
      for (var r = 0; r < 3; r++) for (var i = 0; i < 7 + r * 2; i++) {
        var n = 7 + r * 2, a = Math.PI + (i + .5) / n * Math.PI, rad = 26 + r * 16;
        p += '<circle cx="' + (80 + Math.cos(a) * rad).toFixed(1) + '" cy="' + (96 + Math.sin(a) * rad).toFixed(1) + '" r="4.2" fill="' + kl[Math.floor(i / n * 4)] + '"/>';
      }
      return '<svg viewBox="0 0 160 120">' + p + '<path d="M40 104h80" ' + S + '/><rect class="acc" x="72" y="86" width="16" height="12" fill="#ff5a00"/></svg>';
    })()
  };

  var IKOON = {
    joy: '<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="#111" stroke-width="1.6"/><circle cx="15" cy="15" r="5" fill="#111"/></svg>',
    kl: '<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="none" stroke="#111" stroke-width="1.6"/><path d="M15 15L8 8" stroke="#111" stroke-width="2" stroke-linecap="round"/><text x="15" y="29" font-size="7" text-anchor="middle" font-family="monospace">L</text></svg>',
    kr: '<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="11" fill="none" stroke="#111" stroke-width="1.6"/><path d="M15 15L22 8" stroke="#ff5a00" stroke-width="2" stroke-linecap="round"/><text x="15" y="29" font-size="7" text-anchor="middle" font-family="monospace">R</text></svg>',
    t1: '<svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" rx="4" fill="none" stroke="#111" stroke-width="1.6"/><text x="15" y="19.5" font-size="11" font-weight="700" text-anchor="middle" font-family="monospace">1</text></svg>',
    t2: '<svg viewBox="0 0 30 30"><rect x="4" y="4" width="22" height="22" rx="4" fill="#111"/><text x="15" y="19.5" font-size="11" font-weight="700" text-anchor="middle" fill="#fff" font-family="monospace">2</text></svg>'
  };
  var CTL = [['joy', 'joystick'], ['kl', 'knop links'], ['kr', 'knop rechts'], ['t1', 'toets 1'], ['t2', 'toets 2']];

  // ---------- opbouw ----------
  var raster = document.getElementById('raster');
  APPS.forEach(function (a, i) {
    var el = document.createElement('a');
    el.className = 'tegel glas ' + a.status;
    if (a.status === 'klaar') el.href = a.href;
    el.dataset.i = i;
    el.innerHTML =
      '<div class="rij1"><span class="nr">' + String(i + 1).padStart(2, '0') + '</span><span class="tag">' + a.tag + '</span></div>' +
      '<div class="beeld">' + BEELD[a.id] + '</div>' +
      '<div><h2>' + a.naam + '</h2><p>' + a.tekst + '</p>' +
      '<div class="voet"><span>' + a.spelers + ' spelers · ' + a.tijd + '</span><span class="open">' +
      (a.status === 'klaar' ? '▶ open' : STATUS_TEKST[a.status]) + '</span></div></div>';
    el.addEventListener('mouseenter', function () { kies(i, 0); });
    el.addEventListener('click', function (e) { if (a.status !== 'klaar') { e.preventDefault(); open(i); } });
    raster.appendChild(el);
  });
  var tegels = raster.children;

  var kastjesEl = document.getElementById('kastjes');
  for (var s = 1; s <= 4; s++) {
    var k = document.createElement('div');
    k.className = 'kastje'; k.id = 'k' + s; k.style.setProperty('--kk', KLEUR[s]);
    k.innerHTML = '<span class="led"></span>K' + s + ' <small id="ks' + s + '">wacht</small>';
    kastjesEl.appendChild(k);
  }

  // ---------- kiezen ----------
  var gekozen = 0, wie = 0;
  function kies(i, speler) {
    gekozen = (i + APPS.length) % APPS.length;
    if (speler) wie = speler;
    for (var j = 0; j < tegels.length; j++) tegels[j].classList.toggle('gekozen', j === gekozen);
    tegels[gekozen].style.setProperty('--kies', wie ? KLEUR[wie] : 'var(--oranje)');
    var a = APPS[gekozen];
    document.getElementById('gNr').textContent = String(gekozen + 1).padStart(2, '0') + ' / ' + String(APPS.length).padStart(2, '0') + ' · ' + a.tag;
    document.getElementById('gNaam').textContent = a.naam;
    document.getElementById('gStatus').textContent = a.status === 'klaar' ? 'druk de joystick in om te openen' :
      a.status === 'binnenkort' ? 'wordt nu gebouwd' : 'nog alleen een concept';
    document.getElementById('bediening').innerHTML = CTL.map(function (c, n) {
      return '<div class="ctl">' + IKOON[c[0]] + '<span class="wat">' + c[1] + '</span><span class="doet">' + a.b[n] + '</span></div>';
    }).join('');
  }
  function open(i) {
    var a = APPS[i];
    if (a.status === 'klaar') { location.href = a.href; return; }
    var t = tegels[i];
    t.classList.remove('schud'); void t.offsetWidth; t.classList.add('schud');
    melding(a.naam + ': ' + (a.status === 'binnenkort' ? 'wordt nu gebouwd' : 'nog alleen een concept'));
  }
  var mt;
  function melding(tekst) {
    var m = document.getElementById('melding');
    m.textContent = tekst; m.classList.add('aan');
    clearTimeout(mt); mt = setTimeout(function () { m.classList.remove('aan'); }, 2200);
  }

  var KOL = 4;
  Kastjes.on(function (e) {
    aanwezig(e.speler);
    if (e.type === 'joystick') {
      var r = Math.floor(gekozen / KOL), c = gekozen % KOL, rijen = Math.ceil(APPS.length / KOL);
      if (e.richting === 'links') c = (c + KOL - 1) % KOL;
      if (e.richting === 'rechts') c = (c + 1) % KOL;
      if (e.richting === 'boven') r = (r + rijen - 1) % rijen;
      if (e.richting === 'onder') r = (r + 1) % rijen;
      kies(Math.min(APPS.length - 1, r * KOL + c), e.speler);
    } else if (e.type === 'knop') {
      kies(gekozen + e.stap, e.speler);
    } else if ((e.type === 'joystick-druk' || (e.type === 'knop-druk' && e.welke === 'rechts')) && e.ingedrukt) {
      wie = e.speler; open(gekozen);
    }
  });

  // ---------- kastjes en status ----------
  var gezien = {};
  function aanwezig(s) {
    var k = document.getElementById('k' + s);
    if (!gezien[s]) { gezien[s] = true; k.classList.add('aan'); k.querySelector('.led').classList.add('aan'); document.getElementById('ks' + s).textContent = 'hier'; }
    k.classList.remove('puls'); void k.offsetWidth; k.classList.add('puls');
  }
  for (var n = 1; n <= 4; n++) Kastjes.led(n, KLEUR[n]);
  Kastjes.onStatus(function (st) {
    var led = document.getElementById('midiLed'), t = document.getElementById('midiTekst');
    if (st.midi === 'aan' && st.kastjes > 0) { led.className = 'led aan'; led.style.setProperty('--k', '#21c06b'); t.textContent = 'midi · ' + st.kastjes + (st.kastjes === 1 ? ' kastje' : ' kastjes'); }
    else if (st.midi === 'geblokkeerd') { led.className = 'led aan'; led.style.setProperty('--k', '#ff5a00'); t.textContent = 'midi geblokkeerd · toetsenbord'; }
    else { led.className = 'led'; t.textContent = 'toetsenbord'; }
  });

  function klok() { var d = new Date(); document.getElementById('klok').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  klok(); setInterval(klok, 10000);

  kies(0, 0);
})();
