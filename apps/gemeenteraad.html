<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemeenteraad</title>
<link rel="stylesheet" href="../te-glas.css">
<style>
/* Gemeenteraad: krant boven, gedeelde begroting in het midden, dorpsmeters rechts, vier raadsleden in de hoeken. */
.pagina{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding:18px 270px}
.krant{padding:14px 22px;display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:end}
.krant .kopregel{font:800 clamp(22px,2.3vw,36px)/1.08 var(--f);letter-spacing:-.025em}
.krant .vraag{grid-column:1;font:500 15px/1.35 var(--f);color:var(--ink-2)}
.krant .rechts{grid-column:2;grid-row:1 / span 3;display:grid;gap:8px;justify-items:end}
.fase{display:flex;gap:4px}
.fase span{font:600 10px var(--m);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:rgba(0,0,0,.06);color:var(--muted)}
.fase span.nu{background:#111;color:#fff}
.klok{font:700 34px/1 var(--m);letter-spacing:-.02em;cursor:pointer;user-select:none}
.klok.op{color:var(--oranje);animation:knip 1s steps(2) infinite}
.klok.stil{opacity:.4}
@keyframes knip{50%{opacity:.25}}
.midden{display:grid;grid-template-columns:1fr 250px;gap:14px;min-height:0}
.begroting{padding:16px 18px 14px;display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:0}
.bkop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rest{font:700 13px var(--m);padding:6px 10px;border-radius:999px;background:#111;color:#fff}
.rest.nul{background:#118a49}.rest.min{background:#d12f2f}
.posten{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-height:0}
.post{position:relative;display:grid;grid-template-rows:1fr auto auto;gap:6px;min-height:0;padding:10px;border-radius:14px;background:rgba(255,255,255,.35);border:2px solid transparent;transition:border-color .3s}
.post .koker{position:relative;border-radius:10px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 25%);overflow:hidden}
.post .vul{position:absolute;left:0;right:0;bottom:0;background:#111;border-radius:10px 10px 0 0;transition:height .18s}
.post .ijk{position:absolute;left:-2px;right:-2px;height:0;border-top:2px dashed var(--oranje)}
.post .naam{font:700 15px/1.15 var(--f)}
.post .bedrag{font:700 18px var(--m);letter-spacing:-.02em}
.post .ico{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:30px;filter:grayscale(.2);z-index:1}
.post .eisen{position:absolute;top:8px;right:8px;display:grid;gap:4px;z-index:2}
.post .eisen b{font:700 10px var(--m);padding:3px 6px;border-radius:6px;background:var(--k);color:#111;white-space:nowrap}
.post .wijzers{position:absolute;bottom:-12px;left:0;right:0;display:flex;justify-content:center;gap:3px;z-index:2}
.post .wijzers i{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--k);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.post.flits{animation:flits .5s}
@keyframes flits{0%{transform:scale(1)}40%{transform:scale(1.02)}100%{transform:scale(1)}}
.meters{padding:14px 16px;display:grid;align-content:start;gap:12px}
.meter{display:grid;gap:5px}
.meter .rij{display:flex;justify-content:space-between;font:600 12px var(--m)}
.meter .rij em{font-style:normal;font-weight:700}
.meter .rij em.plus{color:#118a49}.meter .rij em.min{color:#d12f2f}
.meter .balk{height:8px}
.wetten{border-top:1px solid var(--hair);padding-top:10px;display:grid;gap:6px}
.wetten p{margin:0;font:500 12px/1.3 var(--f)}
.wetten p b{font:700 11px var(--m);margin-right:4px}
.onder{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:12px 16px}
.uitleg{font:600 15px/1.35 var(--f)}
.uitleg .label{display:block;margin-bottom:4px}
.hoek .naam{white-space:nowrap}
.hoek .rol{width:14px;height:14px;border-radius:50%;background:var(--rk);margin-left:auto;box-shadow:0 0 0 3px rgba(255,255,255,.7)}
.hoek .status{font:700 11px var(--m);letter-spacing:.1em;text-transform:uppercase}
.hoek .status.ok{color:#118a49}.hoek .status.nee{color:#d12f2f}
.hoek .mini{display:grid;gap:3px}
.hoek .mini div{display:grid;grid-template-columns:72px 1fr 38px;gap:6px;align-items:center;font:500 10.5px var(--m)}
.hoek .mini div.sel{font-weight:700;color:var(--ink)}
.hoek .mini .balk{height:6px}
.hoek.beurt{outline:3px solid var(--k);outline-offset:2px}
/* grote kaarten over het midden */
.kaart{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;width:min(760px,60vw);padding:26px 30px;display:none;gap:14px}
.kaart.aan{display:grid;animation:in .35s}
@keyframes in{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.kaart .groot{font:800 clamp(28px,3vw,46px)/1.05 var(--f);letter-spacing:-.03em}
.kaart .tekst{font:500 17px/1.4 var(--f)}
.stemmen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stem{padding:14px 10px;border-radius:14px;background:rgba(255,255,255,.5);display:grid;gap:6px;justify-items:center;text-align:center}
.stem .badge{width:34px;height:34px;border-radius:9px;background:var(--k);display:grid;place-items:center;font:700 15px var(--m)}
.stem b{font:800 20px var(--f)}
.stem b.voor{color:#118a49}.stem b.tegen{color:#d12f2f}.stem b.onth{color:var(--muted)}
.nota{display:flex;gap:8px;flex-wrap:wrap}
.nota span{font:600 13px var(--f);padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.06)}
.nota span.sel{background:#111;color:#fff}
.koppen{display:grid;gap:8px;max-height:40vh;overflow:auto}
.koppen p{margin:0;font:700 17px/1.25 var(--f)}
.koppen p small{display:block;font:500 11px var(--m);color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.instel{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.instel div{padding:14px;border-radius:14px;background:rgba(255,255,255,.5)}
.instel b{display:block;font:800 40px/1 var(--f)}
dialog#rolkaarten{border:0;border-radius:18px;padding:24px;width:min(1100px,92vw);max-height:90vh;overflow:auto;background:#fafaf7}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(4px)}
.kaarten{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rk{border:2px solid var(--rk);border-radius:14px;padding:14px 16px;break-inside:avoid}
.rk h3{margin:0 0 4px;font:800 24px var(--f)}
.rk p{margin:4px 0;font:500 13px/1.35 var(--f)}
.rk ul{margin:6px 0 0;padding-left:18px;font:500 13px/1.4 var(--f)}
@media print{
  body{overflow:visible;background:#fff}
  body>*:not(dialog){display:none!important}
  dialog#rolkaarten{position:static;width:auto;max-height:none;overflow:visible;box-shadow:none}
  dialog .geenprint{display:none}
}
@media (max-width:1300px){.pagina{padding:18px 260px}.midden{grid-template-columns:1fr 210px}}
</style>
</head>
<body>
<div class="te-achtergrond"><i></i><i></i><i></i><i></i></div>
<div class="pagina">
  <section class="krant glas sterk">
    <div class="label" id="krantLabel">09 · gemeenteraad · kwartwijk</div>
    <div class="kopregel" id="kop">Gemeenteraad van Kwartwijk</div>
    <div class="vraag" id="vraag"></div>
    <div class="rechts">
      <div class="fase" id="fase"><span>voorstel</span><span>bod</span><span>onderhandelen</span><span>stemming</span><span>gevolgen</span></div>
      <div class="klok" id="klok" title="Klik om de klok stil te zetten">–:––</div>
    </div>
  </section>
  <div class="midden">
    <section class="begroting glas">
      <div class="bkop"><span class="label" id="bLabel">begroting</span><span class="rest" id="rest">nog te verdelen € 0</span></div>
      <div class="posten" id="posten"></div>
    </section>
    <section class="meters glas" id="meters"></section>
  </div>
  <footer class="onder glas">
    <div class="uitleg" id="uitleg"></div>
    <div style="display:flex;gap:8px"><button class="knop" id="kaartenKnop">rolkaarten</button><button class="knop" id="opnieuwKnop">opnieuw</button></div>
  </footer>
</div>
<div class="hoek glas h1" id="h1"></div><div class="hoek glas h2" id="h2"></div><div class="hoek glas h3" id="h3"></div><div class="hoek glas h4" id="h4"></div>
<section class="kaart glas sterk" id="kaart"></section>

<dialog id="rolkaarten" data-venster>
  <div class="geenprint" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <b style="font:800 22px var(--f)">Rolkaarten en wettenkaart</b>
    <span style="display:flex;gap:8px"><button class="knop oranje" onclick="window.print()">printen</button><button class="knop" onclick="this.closest('dialog').close()">sluiten</button></span>
  </div>
  <div class="kaarten" id="kaartenInhoud"></div>
</dialog>

<script src="../kastjes.js"></script>
<script src="../thuis.js"></script>
<script>
(function () {
  'use strict';
  var KLEUR = { 1: '#ff7a1a', 2: '#3b8bff', 3: '#21c06b', 4: '#b768ff' };
  var STAP = 25; // bedragen in duizenden euro's, stappen van € 25.000

  // ---------- spelgegevens ----------
  var ROLLEN = [
    { id: 'ond', naam: 'Ondernemer', kleur: '#ff7a1a', achterban: 'winkeliers, bedrijven, werkgevers', wil: 'werk, bereikbaarheid, parkeerplek', gevoelig: 'Vrijheid: de gemeente moet niet alles regelen' },
    { id: 'buurt', naam: 'Buurtbewoner', kleur: '#3b8bff', achterban: 'gezinnen, ouderen, huurders', wil: 'woningen, veiligheid, rust', gevoelig: 'Solidariteit: niemand mag achterblijven' },
    { id: 'jong', naam: 'Jongere', kleur: '#b768ff', achterban: 'jongeren van 12 tot 23', wil: 'een eigen plek, sport, inspraak', gevoelig: 'Gelijkwaardigheid: jongeren tellen ook mee' },
    { id: 'natuur', naam: 'Natuur', kleur: '#21c06b', achterban: 'dieren, bomen, toekomstige bewoners', wil: 'groen, schone lucht, duurzaam bouwen', gevoelig: 'Spreekt voor wie zelf geen stem heeft' }
  ];
  var WETTEN = [
    { nr: 'W1', tekst: 'Het Ooievaarsveld is beschermd natuurgebied. Daar mag niet gebouwd worden.' },
    { nr: 'W2', tekst: 'Iedereen moet bij de huisarts kunnen komen, ook zonder auto.' },
    { nr: 'W3', tekst: 'Camera’s op straat alleen als het echt nodig is: nooit meer dan de helft van het geld.' }
  ];
  var MKEYS = ['wonen', 'werk', 'groen', 'jongeren', 'veiligheid'];
  // doel = hoe de achterban het geld het liefst verdeeld ziet (aandelen), eis = harde eis van de rolkaart
  var SCEN = [
    { id: 'fabriek', titel: 'Het fabrieksterrein', kop: 'Fabrieksterrein staat leeg: wat komt erop?', vraag: 'Het oude fabrieksterrein is van de gemeente. Er is € 1 miljoen. Waar gaat het geld heen?', budget: 1000,
      posten: [{ naam: 'Woningen', ico: '🏠', m: { wonen: 1 } }, { naam: 'Bedrijfsruimte', ico: '🏭', m: { werk: 1 } }, { naam: 'Park', ico: '🌳', m: { groen: 1 } }, { naam: 'Jongerenplek', ico: '🛹', m: { jongeren: 1 } }],
      doel: { ond: [.2, .5, .1, .2], buurt: [.5, .1, .25, .15], jong: [.2, .15, .2, .45], natuur: [.15, .05, .6, .2] },
      eis: { ond: { p: 1, min: 250, t: 'Minstens € 250.000 naar bedrijfsruimte.' }, buurt: { p: 0, min: 300, t: 'Minstens € 300.000 naar nieuwe betaalbare woningen.' }, jong: { p: 3, min: 150, t: 'Minstens € 150.000 voor de jongerenplek. Anders steun je het plan niet.' }, natuur: { p: 2, min: 300, t: 'Minstens € 300.000 voor het park.' } },
      gebeurtenis: { kop: 'Supermarkt wil op het fabrieksterrein bouwen', tekst: 'Een supermarkt belooft 40 banen als hij op het terrein mag. De winkeliers willen nu nog meer bedrijfsruimte.', rol: 'ond', doel: [.15, .6, .05, .2] } },
    { id: 'plein', titel: 'Overlast bij het plein', kop: 'Bewoners klagen over hangjongeren op het plein', vraag: 'Er is € 400.000 om het plein beter te maken. Wat helpt echt?', budget: 400,
      posten: [{ naam: 'Camera’s en boa’s', ico: '📹', m: { veiligheid: 1, jongeren: -.5 } }, { naam: 'Jongerenwerker', ico: '🤝', m: { jongeren: 1, veiligheid: .5 } }, { naam: 'Verlichting', ico: '💡', m: { veiligheid: .7, groen: -.4 } }, { naam: 'Sportkooi', ico: '⚽', m: { jongeren: 1 } }],
      doel: { ond: [.4, .1, .4, .1], buurt: [.45, .15, .3, .1], jong: [.05, .4, .1, .45], natuur: [.15, .35, .05, .45] },
      eis: { ond: { p: 0, min: 100, t: 'Minstens € 100.000 voor camera’s en boa’s. Klanten moeten zich veilig voelen.' }, buurt: { p: 0, min: 150, t: 'Minstens € 150.000 voor camera’s en boa’s.' }, jong: { p: 3, min: 100, t: 'Minstens € 100.000 voor de sportkooi.' }, natuur: { p: 2, max: 100, t: 'Hoogstens € 100.000 voor verlichting. Licht ’s nachts jaagt vleermuizen weg.' } },
      gebeurtenis: { kop: 'Filmpje van ruzie op het plein gaat viraal', tekst: 'Heel het dorp heeft het gezien. De buurt wil nu vooral meer toezicht.', rol: 'buurt', doel: [.6, .1, .25, .05] } },
    { id: 'bez', titel: 'Bezuinigen', kop: 'Rijk geeft minder geld: Kwartwijk moet schrappen', vraag: 'De raad moet € 300.000 schrappen. Er is nog maar € 900.000. Wie levert in?', budget: 900, start: [400, 300, 300, 200],
      posten: [{ naam: 'Bibliotheek', ico: '📚', m: { jongeren: .5, wonen: .5 } }, { naam: 'Buurtbus', ico: '🚌', m: { wonen: 1 } }, { naam: 'Sportsubsidie', ico: '🏅', m: { jongeren: 1 } }, { naam: 'Bomen planten', ico: '🌱', m: { groen: 1 } }],
      doel: { ond: [.3, .3, .25, .15], buurt: [.35, .35, .15, .15], jong: [.3, .1, .45, .15], natuur: [.25, .15, .15, .45] },
      eis: { ond: { p: 1, min: 200, t: 'Minstens € 200.000 voor de buurtbus. Klanten moeten bij de winkels komen.' }, buurt: { p: 1, min: 250, t: 'Minstens € 250.000 voor de buurtbus.' }, jong: { p: 2, min: 250, t: 'Minstens € 250.000 voor sportsubsidie.' }, natuur: { p: 3, min: 200, t: 'Er wordt niet op bomen bezuinigd: minstens € 200.000.' } },
      gebeurtenis: { kop: '“De buurtbus is mijn enige manier om bij de dokter te komen”', tekst: '40 ouderen komen naar de inspraakavond. De buurt wil de buurtbus nu echt houden.', rol: 'buurt', doel: [.3, .5, .1, .1] } },
    { id: 'zon', titel: 'Het zonnepark', kop: 'Kwartwijk moet duurzame energie opwekken', vraag: 'Er is € 1,5 miljoen. Nu goedkoop of later beter? En wat doen we met de natuur?', budget: 1500,
      posten: [{ naam: 'Zonnepark Ooievaarsveld', ico: '☀️', m: { werk: 1, groen: -1 } }, { naam: 'Panelen op daken', ico: '🔆', m: { groen: 1 } }, { naam: 'Isolatie huurhuizen', ico: '🧱', m: { wonen: 1, groen: .5 } }, { naam: 'Korting energierekening', ico: '💶', m: { wonen: 1 } }],
      doel: { ond: [.5, .3, .1, .1], buurt: [.1, .2, .4, .3], jong: [.2, .4, .2, .2], natuur: [0, .45, .45, .1] },
      eis: { ond: { p: 0, min: 500, t: 'Minstens € 500.000 voor het zonnepark. Dat is het goedkoopst.' }, buurt: { p: 3, min: 300, t: 'Minstens € 300.000 korting op de energierekening.' }, jong: { p: 1, min: 300, t: 'Minstens € 300.000 voor panelen op daken.' }, natuur: { p: 0, max: 0, t: 'Geen euro naar het zonnepark op het Ooievaarsveld.' } },
      gebeurtenis: { kop: 'Ondernemer uit het dorp wil het zonnepark bouwen', tekst: 'Hij neemt 20 mensen uit Kwartwijk in dienst. De winkeliers willen het zonnepark nu nog liever.', rol: 'ond', doel: [.6, .25, .1, .05] } }
  ];
  function wetGebroken(sc, v) {
    var w = [];
    if (sc.id === 'zon' && v[0] > 0) w.push(WETTEN[0]);
    if (sc.id === 'bez' && v[1] < 100) w.push(WETTEN[1]);
    if (sc.id === 'plein' && v[0] > sc.budget / 2) w.push(WETTEN[2]);
    return w;
  }
  var NOTAS = ['De buurt is niet gehoord', 'Te duur', 'Slecht voor de natuur', 'Jongeren zijn vergeten', 'Goed voor nu, slecht voor later', 'Dit is oneerlijk verdeeld'];
  var FASES = ['voorstel', 'bod', 'onderhandelen', 'stemming', 'gevolgen'];

  // ---------- toestand ----------
  var g = {
    fase: 'instellen', aantal: 4, rondes: 4, ronde: 0, spelers: [], rol: {}, verdeling: [], vorige: [], bod: {}, sel: {}, klaar: {},
    eis: {}, eisGezet: {}, terStemming: {}, stem: {}, stemVast: {}, verworpen: 0, laatste: [], meters: {}, metersVoor: null, koppen: [],
    rechter: {}, rechterBezig: false, nota: 0, besluit: null, gebeurd: false, doelRonde: {}, klok: 0, klokLoopt: false, klokStil: false
  };
  MKEYS.forEach(function (k) { g.meters[k] = 50; });
  var actief = {};
  // Eén kastje: het kastje speelt om de beurt raadslid 1, 2, 3 en 4 (doorgeven).
  var fysiek = {}, fysiekNr = 1, beurt = 1;
  function solo() { return Object.keys(fysiek).length <= 1; }

  function sc() { return SCEN[g.ronde % SCEN.length]; }
  function som(v) { return v.reduce(function (a, b) { return a + b; }, 0); }
  function plafond() { var s = sc(); return Math.max(s.budget, s.start ? som(s.start) : 0); }
  function euro(k) { return '€ ' + (Math.round(k) * 1000).toLocaleString('nl-NL'); }
  function rolVan(s) { return ROLLEN[g.rol[s]]; }
  function meerderheid() { return g.spelers.length >= 4 ? 3 : 2; }
  function speler(i) { return g.spelers.indexOf(i) >= 0; }

  // tevredenheid van de achterban (0..1): afstand tot de gewenste verdeling, gehalveerd als de harde eis niet gehaald wordt
  function eisGehaald(e, v) { return e.max !== undefined ? v[e.p] <= e.max : v[e.p] >= e.min; }
  function tevreden(s, v) {
    var r = rolVan(s); if (!r) return 0;
    var doel = g.doelRonde[r.id] || sc().doel[r.id], tot = Math.max(som(v), 1), afw = 0;
    for (var i = 0; i < 4; i++) afw += Math.abs(v[i] / tot - doel[i]);
    var t = 1 - afw / 1.4;
    if (!eisGehaald(sc().eis[r.id], v)) t *= 0.45;
    return Math.max(0, Math.min(1, t));
  }
  function mengKleur(t) { // rood -> geel -> groen
    var r = t < .5 ? 255 : Math.round(255 * (1 - t) * 2), gr = t < .5 ? Math.round(255 * t * 2) : 220;
    return '#' + [r, gr, 40].map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }

  // ---------- leds ----------
  var knipper = 0;
  function ledVoor(s) {
    var r = rolVan(s);
    if (g.rechterBezig) return (knipper % 2) ? '#b768ff' : '#000000';
    if (g.fase === 'instellen' || !r) return KLEUR[s];
    if (g.fase === 'voorstel') return r.kleur;
    if (g.fase === 'bod') return mengKleur(tevreden(s, g.bod[s]));
    if (g.fase === 'onderhandelen') return g.terStemming[s] ? '#ffffff' : mengKleur(tevreden(s, g.verdeling));
    if (g.fase === 'stemming') { if (g.stemVast[s]) return '#ffffff'; return { voor: '#20d060', tegen: '#ff2020', onth: '#808080' }[g.stem[s]] || '#ffffff'; }
    if (g.fase === 'uitslag' || g.fase === 'provincie') return g.besluit === 'provincie' ? '#ff4010' : ({ voor: '#20d060', tegen: '#ff2020', onth: '#000000' }[g.stem[s]] || '#000000');
    if (g.fase === 'gevolgen' || g.fase === 'einde') return mengKleur(tevreden(s, g.verdeling));
    return r.kleur;
  }
  function leds() {
    if (solo()) { Kastjes.led(fysiekNr, ledVoor(g.fase === 'instellen' ? fysiekNr : beurt)); return; }
    for (var s = 1; s <= 4; s++) if (actief[s]) Kastjes.led(s, ledVoor(s));
  }

  // ---------- tekenen ----------
  function tekenFase() {
    var f = g.fase === 'uitslag' || g.fase === 'provincie' ? 'stemming' : g.fase;
    var sp = document.querySelectorAll('#fase span');
    for (var i = 0; i < sp.length; i++) sp[i].classList.toggle('nu', FASES[i] === f);
  }
  function tekenPosten() {
    var s = sc(), v = g.verdeling, max = plafond();

      g.koppen.filter(Boolean).map(function (k) { return '<p><small>ronde ' + k.ronde + ' · ' + k.titel + '</small>' + k.kop + (k.nota ? '<br><span style="font-weight:500;font-size:14px">' + k.nota + '</span>' : '') + '</p>'; }).join('') +
      '</div><div class="tekst">Nabespreking: welk besluit vond jij het minst eerlijk? Was het daarom ook fout? Wie komt er in het echt op voor de natuur?</div><div class="tekst" style="color:var(--muted)">Toets 2 = nieuw spel.</div>');
    zetUitleg('einde', 'Vergelijk jullie dorpsmeters met die van een andere raad. Toets 2 = nieuw spel.');
    tekenMeters(); teken();
  }

  // ---------- klok ----------
  var klokEind = 0, klokRest = 0, klokTimer = null;
  function startKlok(sec) { g.klokLoopt = true; g.klokStil = false; klokEind = performance.now() + sec * 1000; klokRest = sec * 1000; if (!klokTimer) klokTimer = setInterval(tik, 250); tik(); }
  function stopKlok() { g.klokLoopt = false; document.getElementById('klok').className = 'klok'; }
  function tik() {
    var k = document.getElementById('klok');
    if (!g.klokLoopt) return;
    if (g.klokStil) { klokEind = performance.now() + klokRest; return; }
    klokRest = Math.max(0, klokEind - performance.now());
    var sec = Math.ceil(klokRest / 1000);
    k.textContent = Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2);
    k.className = 'klok' + (sec === 0 ? ' op' : '');
    if (g.fase === 'onderhandelen' && !g.gebeurd && g.verworpen === 0 && klokRest < 120000) gebeurtenis();
    if (g.fase === 'stemming' && sec === 0 && !solo()) uitslag();
  }
  document.getElementById('klok').addEventListener('click', function () { if (!g.klokLoopt) return; g.klokStil = !g.klokStil; this.classList.toggle('stil', g.klokStil); });
  function gebeurtenis() {
    g.gebeurd = true;
    var e = sc().gebeurtenis; if (!e) return;
    g.doelRonde[e.rol] = e.doel;
    kaart('<span class="label">laatste nieuws</span><div class="groot">' + e.kop + '</div><div class="tekst">' + e.tekst + '</div>');
    setTimeout(function () { if (g.fase === 'onderhandelen') kaart(null); }, 7000);
    teken();
  }

  // ---------- bediening ----------
  function draai(s, v, i, stap, wie) {
    var nieuw = v[i] + stap * STAP, cap = plafond();
    if (nieuw < 0) return false;
    if (stap > 0 && som(v) + STAP > cap) return false;
    if (stap < 0 && v === g.verdeling) {
      for (var k in g.eis) { var e = g.eis[k]; if (e && e.p === i && nieuw < e.min) { flitsPost(i); return false; } }
    }
    v[i] = nieuw;
    if (v === g.verdeling) g.laatste[i] = wie;
    return true;
  }
  function flitsPost(i) { var p = document.querySelectorAll('.post')[i]; if (p) { p.classList.remove('flits'); void p.offsetWidth; p.classList.add('flits'); } }

  var tv = { 1: {}, 2: {}, 3: {}, 4: {} }, combo = {};
  Kastjes.on(function (e) {
    var eerste = !fysiek[e.speler];
    fysiek[e.speler] = true; fysiekNr = e.speler;
    if (eerste && Object.keys(fysiek).length === 2 && g.fase === 'instellen') { actief = {}; for (var k in fysiek) actief[k] = true; }
    if (g.fase === 'instellen' && !solo()) { actief[e.speler] = true; var na = Math.max(2, Object.keys(actief).length); if (eerste) g.aantal = na; if (eerste) { tekenInstellen(); teken(); } }
    if (solo()) actief = {}, actief[fysiekNr] = true;
    var s = solo() ? (g.fase === 'instellen' ? fysiekNr : beurt) : e.speler;
    if (g.fase !== 'instellen' && !speler(s)) return; // kastje dat niet meedoet

    if (e.type === 'toets') { toets(e, s); return; }
    if (e.type === 'knop') {
      if (g.fase === 'instellen') {
        if (e.welke === 'rechts') g.aantal = Math.max(2, Math.min(4, g.aantal + e.stap));
        else g.rondes = g.rondes === 3 ? 4 : 3;
        tekenInstellen(); teken(); return;
      }
      if (g.fase === 'bod' && !g.klaar[s]) {
        if (e.welke === 'links') g.sel[s] = (g.sel[s] + (e.stap > 0 ? 1 : 3)) % 4;
        else draai(s, g.bod[s], g.sel[s], e.stap, s);
        teken(); return;
      }
      if (g.fase === 'onderhandelen') {
        if (e.welke === 'links') g.sel[s] = (g.sel[s] + (e.stap > 0 ? 1 : 3)) % 4;
        else if (draai(s, g.verdeling, g.sel[s], e.stap, s)) { g.terStemming = {}; }
        teken(); return;
      }
      if (g.fase === 'uitslag' && e.welke === 'rechts' && g.tegen && g.tegen.length && (solo() || g.tegen.indexOf(s) >= 0)) {
        g.nota = (g.nota + (e.stap > 0 ? 1 : NOTAS.length - 1)) % NOTAS.length; tekenNota(); return;
      }
      return;
    }
    if (e.type === 'knop-druk' && e.welke === 'rechts' && e.ingedrukt && g.fase === 'onderhandelen') {
      // eigen bedrag op deze post terugzetten naar het vorige voorstel
      var i = g.sel[s], terug = g.vorige[i] - g.verdeling[i];
      if (terug && (terug < 0 || som(g.verdeling) + terug <= plafond())) {
        var eisBlok = false; for (var k2 in g.eis) { var ee = g.eis[k2]; if (ee && ee.p === i && g.vorige[i] < ee.min) eisBlok = true; }
        if (!eisBlok) { g.verdeling[i] = g.vorige[i]; g.laatste[i] = s; g.terStemming = {}; }
      }
      teken(); return;
    }
    if (e.type === 'joystick') {
      if (g.fase === 'stemming' && !g.stemVast[s]) {
        var keuze = { rechts: 'voor', links: 'tegen', boven: 'onth' }[e.richting];
        if (keuze) { g.stem[s] = keuze; teken(); }
      } else if (g.fase === 'gevolgen' && e.richting === 'boven') naarRechter(solo() ? vrijeRechter() : s);
      return;
    }
    if (e.type === 'joystick-druk' && e.ingedrukt) {
      if (g.fase === 'stemming' && g.stem[s] && !g.stemVast[s]) {
        g.stemVast[s] = true;
        if (solo()) {
          var idx = g.spelers.indexOf(s);
          if (idx >= g.spelers.length - 1) { setTimeout(uitslag, 400); }
          else { beurt = g.spelers[idx + 1]; zetUitleg('stemming', 'Geef het kastje aan ' + kleurNaam(beurt) + '. De anderen kijken even weg.'); }
        } else if (g.spelers.every(function (sp) { return g.stemVast[sp]; })) setTimeout(uitslag, 400);
        teken(); return;
      }
      if (g.fase === 'onderhandelen' && solo()) { naarStemming(); return; }
    }
  });
  function vrijeRechter() { for (var i = 0; i < g.spelers.length; i++) if (!g.rechter[g.spelers[i]]) return g.spelers[i]; return g.spelers[0]; }

  function toets(e, s) {
    var f = e.speler; tv[f][e.nr] = e.ingedrukt;
    if (tv[f][1] && tv[f][2]) combo[f] = true;
    if (e.ingedrukt) return;
    if (combo[f]) { if (!tv[f][1] && !tv[f][2]) combo[f] = false; return; }
    if (g.rechterBezig) return;
    if (e.nr === 1) {
      if (g.fase === 'onderhandelen') {
        if (g.eis[s] && g.eis[s].p === g.sel[s]) { g.eis[s] = null; zetUitleg('eis weg', rolVan(s).naam + ' haalt de eis weg.'); }
        else if (g.eisGezet[s]) { zetUitleg('al gebruikt', 'Je mag één eis per ronde zetten. Druk toets 1 op de post met je eis om hem weg te halen.'); }
        else { g.eis[s] = { p: g.sel[s], min: g.verdeling[g.sel[s]] }; g.eisGezet[s] = true; flitsPost(g.sel[s]); }
        teken();
      }
      return;
    }
    // toets 2
    switch (g.fase) {
      case 'instellen': kaart(null); start(); break;
      case 'voorstel':
        if (solo()) { naarBod(); break; }
        g.klaar[s] = !g.klaar[s];
        if (g.spelers.every(function (sp) { return g.klaar[sp]; })) naarBod(); else teken();
        break;
      case 'bod':
        var rest = sc().budget - som(g.bod[s]);
        if (rest !== 0 && !g.klaar[s]) { zetUitleg('eerste bod', rest > 0 ? 'Er ligt nog ' + euro(rest) + '. Verdeel eerst al het geld.' : 'Er moet nog ' + euro(-rest) + ' geschrapt worden.'); return; }
        if (solo()) {
          g.klaar[s] = true;
          var idx = g.spelers.indexOf(s);
          if (idx >= g.spelers.length - 1) { naarOnderhandelen(); break; }
          beurt = g.spelers[idx + 1];
          zetUitleg('eerste bod', 'Geef het kastje aan ' + kleurNaam(beurt) + '. Verdeel het geld zoals jouw achterban het wil. Toets 2 = vast en doorgeven.');
          teken(); break;
        }
        g.klaar[s] = !g.klaar[s];
        if (g.spelers.every(function (sp) { return g.klaar[sp]; })) naarOnderhandelen(); else teken();
        break;
      case 'onderhandelen':
        if (solo()) {
          var i2 = g.spelers.indexOf(s); beurt = g.spelers[(i2 + 1) % g.spelers.length];
          zetUitleg('onderhandelen', 'Het kastje is nu van ' + kleurNaam(beurt) + ' (' + rolVan(beurt).naam + '). Toets 1 = eis · toets 2 = doorgeven · joystick indrukken = ter stemming.');
          teken(); break;
        }
        g.terStemming[s] = !g.terStemming[s];
        var n = g.spelers.filter(function (sp) { return g.terStemming[sp]; }).length;
        if (n >= meerderheid()) naarStemming(); else teken();
        break;
      case 'uitslag':
        if (g.besluit === 'aangenomen') gevolgen(); else naarOnderhandelen(true);
        break;
      case 'provincie': gevolgen(); break;
      case 'vernietigd': naarOnderhandelen(true, 'De rechter heeft het besluit vernietigd. Pas de begroting aan zodat hij zich aan de wet houdt.'); break;
      case 'gevolgen': case 'rechterOk':
        kaart(null);
        if (g.ronde + 1 >= g.rondes) einde(); else { g.ronde++; nieuweRonde(); }
        break;
      case 'einde': instellen(); break;
    }
  }

  // ---------- rolkaarten om te printen ----------
  function rolkaarten() {
    var html = ROLLEN.map(function (r) {
      return '<div class="rk" style="--rk:' + r.kleur + '"><h3 style="color:' + r.kleur + '">' + r.naam + '</h3><p><b>Je achterban:</b> ' + r.achterban + '</p><p><b>Wil vooral:</b> ' + r.wil + '</p><p><b>Gevoelig punt:</b> ' + r.gevoelig + '</p><ul>' +
        SCEN.map(function (s) {
          var d = s.doel[r.id], top = [0, 1, 2, 3].sort(function (a, b) { return d[b] - d[a]; }).slice(0, 2);
          return '<li><b>' + s.titel + ':</b> het belangrijkst is ' + s.posten[top[0]].naam.toLowerCase() + ', daarna ' + s.posten[top[1]].naam.toLowerCase() + '. <b>Harde eis:</b> ' + s.eis[r.id].t + '</li>';
        }).join('') + '</ul></div>';
    }).join('');
    html += '<div class="rk" style="--rk:#111;grid-column:1 / -1"><h3>Wettenkaart van Kwartwijk</h3>' + WETTEN.map(function (w) { return '<p><b>' + w.nr + '</b> ' + w.tekst + '</p>'; }).join('') +
      '<p style="color:#77776f">Breekt een aangenomen besluit een wet? Dan mag elk raadslid één keer per spel naar de rechter (joystick omhoog bij de gevolgen).</p></div>';
    document.getElementById('kaartenInhoud').innerHTML = html;
  }
  rolkaarten();
  document.getElementById('kaartenKnop').addEventListener('click', function () { document.getElementById('rolkaarten').showModal(); });
  document.getElementById('opnieuwKnop').addEventListener('click', function () { this.blur(); instellen(); });

  window.gemeenteraad = g; // handig bij testen
  instellen();
})();
</script>
</body>
