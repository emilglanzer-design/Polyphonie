<!doctype html>
<html lang="nl">
<head>

<title>Schoolplein</title>
<link rel="stylesheet" href="../te-glas.css">
<style>
/* Schoolplein: plattegrond vult het midden, bovenin budget en meters, onderin vier spelerkaarten. */
#kaart{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:5}
.boven{position:fixed;top:14px;left:56px;right:16px;z-index:20;display:grid;grid-template-columns:auto 1fr auto auto;gap:22px;align-items:center;padding:12px 18px}
.titel .kop{font-size:clamp(20px,1.9vw,28px)}
.titel .label{margin-bottom:5px}
.budget{display:grid;gap:6px;min-width:260px}
.budget .getal{display:flex;align-items:baseline;gap:10px;font:700 22px var(--m);letter-spacing:-.02em}
.budget .getal small{font:500 12px var(--m);color:var(--muted)}
.budget .balk{height:9px;border-radius:5px;background:rgba(0,0,0,.09)}
.budget .balk i{background:var(--ink);transition:width .25s,background .25s}
.budget.te-veel .balk i{background:#e5372a}
.budget.te-veel .getal{color:#e5372a}
.budget .over{font:600 11.5px var(--m);color:var(--ink-2)}
.meters{display:flex;gap:8px}
.meter{display:grid;justify-items:center;gap:3px;min-width:70px;padding:7px 8px;border-radius:12px;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.8)}
.meter b{font:700 19px var(--m)}
.meter .label{font-size:9.5px}
.meter i{width:8px;height:8px;border-radius:50%;display:block}
.knoppen{display:flex;gap:8px}
.onder{position:fixed;left:56px;right:16px;bottom:14px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kaart{padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;min-height:96px;transition:opacity .3s}
.kaart.slaapt{opacity:.5}
.kaart .badge{width:30px;height:30px;border-radius:8px;background:var(--k);display:grid;place-items:center;font:700 14px var(--m);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.kaart .kopje{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kaart .kopje b{font:700 14px var(--f)}
.kaart canvas{grid-row:2 / span 2;width:64px;height:64px;border-radius:10px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8)}
.kaart .wat{font:700 13.5px var(--f);line-height:1.15}
.kaart .info{font:500 11px var(--m);color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.kaart .info b{color:var(--ink)}
.kaart .tip{grid-column:1 / -1;font:500 9.5px/1.35 var(--m);color:var(--muted);letter-spacing:.01em}
.kaart .wacht{grid-column:2;font:500 12px var(--f);color:var(--ink-2)}
@media (max-width:1250px){.meters .meter{min-width:56px}.titel .label{display:none}.boven{gap:14px}}
</style>
</head>
<body>
<div class="te-achtergrond"><i></i><i></i><i></i><i></i></div>
<canvas id="kaart"></canvas>

<header class="boven glas">
  <div class="titel"><div class="label">Candea College · Eltensestraat 8 · Duiven</div><h1 class="kop">Schoolplein<span class="oranje">.</span></h1></div>
  <div class="budget" id="budget">
    <div class="getal"><span id="besteed">€0</span><small>van <span id="totaal">€150.000</span></small></div>
    <div class="balk"><i id="balk" style="width:0%"></i></div>
    <div class="over" id="over">Nog €150.000 te besteden</div>
  </div>
  <div class="meters">
    <div class="meter"><i style="background:#3f9a4a"></i><b id="m-groen">0</b><span class="label">Groen</span></div>
    <div class="meter"><i style="background:#ff5a00"></i><b id="m-sport">0</b><span class="label">Sport</span></div>
    <div class="meter"><i style="background:#3b8bff"></i><b id="m-zit">0</b><span class="label">Zitplek</span></div>
    <div class="meter"><i style="background:#555"></i><b id="m-schaduw">0</b><span class="label">Schaduw</span></div>
  </div>
  <div class="knoppen">
    <button class="knop" id="k-budget" title="Wissel het totaalbudget">Budget</button>
    <button class="knop" id="k-leeg" title="Haal alles weg">Leeg</button>
  </div>
</header>

<section class="onder" id="onder"></section>

function maat() {
  dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  var top = document.querySelector('.boven').getBoundingClientRect().bottom + 18;
  var bodem = document.querySelector('.onder').getBoundingClientRect().top - 18;
  var links = 70, rechts = W - 30, best = null;
  for (var g = 0; g < 180; g += 5) {
    var th = g * Math.PI / 180, c = Math.cos(th), s = Math.sin(th), x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
