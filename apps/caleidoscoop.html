<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caleidoscoop</title>
<style>
/* Eén donker doek vol scherm; vier spelershoeken met kleur, grootte en penseel. Bewust alleen donker: licht moet gloeien. */
:root{--bg:#07080b;--ink:#eef0f3;--muted:#8a909a;--panel:#12141acc;--line:#2a2e36;--f:"Helvetica Neue",Helvetica,Arial,sans-serif;--m:ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px);display:grid;gap:6px;transition:opacity .3s}
.hud.weg{display:none}
.hud .top{display:flex;align-items:center;gap:10px}
.hud .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;flex:none}
.hud .nm{font-weight:800;font-size:16px}
.hud .st{font:600 11px var(--m);color:var(--muted)}
.hud .row{display:flex;justify-content:space-between;font:500 12px var(--m)}
.hud .row b{color:var(--ink)}
#h1{top:14px;left:14px}#h2{top:14px;right:14px}#h3{bottom:14px;left:14px}#h4{bottom:14px;right:14px}
#mid{position:fixed;left:50%;top:14px;transform:translateX(-50%);text-align:center;font:700 13px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px}
#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(620px,calc(100% - 520px));font-size:12.5px;color:var(--muted);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
@media (max-width:1100px){#help{display:none}}
#help b{color:var(--ink)}
</style>
</head>
<body>
<canvas id="doek"></canvas>
<div id="mid">Caleidoscoop · <span id="sym">8</span> spiegels</div>
<div class="hud" id="h1"></div><div class="hud" id="h2"></div><div class="hud" id="h3"></div><div class="hud" id="h4"></div>
<div id="help"><b>Joystick</b> bewegen · <b>indrukken</b> pen op/neer · <b>knop links</b> grootte (indrukken: penseel) · <b>knop rechts</b> kleur · <b>toets 1</b> aantal spiegels · <b>toets 2</b> 2 sec vasthouden: doek leeg · <b>Shift+S</b>: opslaan als plaatje</div>
<script>
/*
 * kastjes.js — gedeelde code voor alle kastjes-pagina's (versie 0.1)
 *
 * Elke pagina laadt dit bestand. Het leest de vier kastjes uit (USB-MIDI in Chrome)
 * én het toetsenbord, en geeft beide door als dezelfde gebeurtenissen.
 * Een pagina hoeft dus niet te weten of er kastjes of een toetsenbord aan hangen.
 *
 *   Kastjes.on(function (e) { ... })
 *     e.speler     1 t/m 4
 *     e.type       'joystick'       e.richting = 'boven' | 'onder' | 'links' | 'rechts'
 *                                   (komt één keer bij duwen, en herhaalt zolang je vasthoudt)
 *                  'joystick-druk'  e.ingedrukt = true/false
 *                  'knop'           e.welke = 'links' | 'rechts', e.stap = +1 of -1
 *                  'knop-druk'      e.welke = 'links' | 'rechts', e.ingedrukt = true/false
 *                  'toets'          e.nr = 1 | 2, e.ingedrukt = true/false
 *     e.bron       'toetsenbord' | 'midi'
 *
 *   Kastjes.joystick(speler)   -> { x, y } tussen -1 en 1 (voor vloeiend verplaatsen)
 *   Kastjes.led(speler, '#ff7a1a')   ledstrip in een kleur zetten
 *   Kastjes.onLed(fn)          fn(speler, kleur) voor een virtuele ledstrip op het scherm
 *   Kastjes.onStatus(fn)       fn({ midi: 'aan' | 'geen' | 'geblokkeerd', kastjes: n })
 *   Kastjes.toetsen            de toetsenbordindeling per speler (voor een hulpscherm)
 *
 * VOORSTEL MIDI-afspraken (nog te bevestigen bij het schrijven van de Pico-code):
 *   MIDI-kanaal 1 t/m 4 = speler 1 t/m 4
 *   CC 1  joystick X   0..127 (64 = midden, 0 = links)
 *   CC 2  joystick Y   0..127 (64 = midden, 0 = boven)
 *   CC 10 draaiknop links  relatief: 1..63 = +stappen, 65..127 = -(128-waarde) stappen
 *   CC 11 draaiknop rechts relatief, zelfde codering
 *   Noot 60 joystick indrukken, 61 knop links indrukken, 62 knop rechts indrukken,
 *   Noot 63 toets 1, 64 toets 2   (note on = ingedrukt, note off of velocity 0 = los)
 *   Naar het kastje: CC 20/21/22 = rood/groen/blauw 0..127 op het kanaal van de speler.
 *
 * Terugvaloptie zonder Chrome: het kastje meldt zich als toetsenbord en stuurt precies
 * de toetsen hieronder. Dan werkt elke pagina ook in Safari.
 */
(function () {
  'use strict';

  var handlers = [];
  var ledHandlers = [];
  var statusHandlers = [];
  var status = { midi: 'geen', kastjes: 0 };
  var midiOut = [];

  // ---------- toetsenbordindeling (fysieke posities, werkt ook op een Nederlandse Mac) ----------
  // Per speler: joystick (4 richtingen), joystick indrukken, knop links -/+, knop rechts -/+,
  // knop rechts indrukken, toets 1, toets 2.
  var TOETSEN = {
    1: { boven: 'KeyW', links: 'KeyA', onder: 'KeyS', rechts: 'KeyD', druk: 'KeyE',
         knopLinksMin: 'Digit1', knopLinksPlus: 'Digit2', knopRechtsMin: 'Digit3', knopRechtsPlus: 'Digit4',
         knopRechtsDruk: 'KeyR', toets1: 'KeyZ', toets2: 'KeyX' },
    2: { boven: 'KeyT', links: 'KeyF', onder: 'KeyG', rechts: 'KeyH', druk: 'KeyY',
         knopLinksMin: 'Digit5', knopLinksPlus: 'Digit6', knopRechtsMin: 'Digit7', knopRechtsPlus: 'Digit8',
         knopRechtsDruk: 'KeyU', toets1: 'KeyC', toets2: 'KeyV' },
    3: { boven: 'KeyI', links: 'KeyJ', onder: 'KeyK', rechts: 'KeyL', druk: 'KeyO',
         knopLinksMin: 'Digit9', knopLinksPlus: 'Digit0', knopRechtsMin: 'Minus', knopRechtsPlus: 'Equal',
         knopRechtsDruk: 'KeyP', toets1: 'KeyB', toets2: 'KeyN' },
    4: { boven: 'ArrowUp', links: 'ArrowLeft', onder: 'ArrowDown', rechts: 'ArrowRight', druk: 'Enter',
         knopLinksMin: 'BracketLeft', knopLinksPlus: 'BracketRight', knopRechtsMin: 'Semicolon', knopRechtsPlus: 'Quote',
         knopRechtsDruk: 'Backslash', toets1: 'Period', toets2: 'Slash' }
  };

  var codeNaar = {}; // 'KeyW' -> { speler: 1, functie: 'boven' }
  Object.keys(TOETSEN).forEach(function (s) {
    var m = TOETSEN[s];
    Object.keys(m).forEach(function (f) { codeNaar[m[f]] = { speler: +s, functie: f }; });
  });

  // joystickstand per speler, uit toetsenbord en uit MIDI
  var toetsJoy = { 1: {}, 2: {}, 3: {}, 4: {} };            // ingedrukte richtingtoetsen
  var midiJoy = { 1: { x: 0, y: 0 }, 2: { x: 0, y: 0 }, 3: { x: 0, y: 0 }, 4: { x: 0, y: 0 } };
  var herhaal = { 1: null, 2: null, 3: null, 4: null };     // { richting, volgende }

  function emit(e) {
    for (var i = 0; i < handlers.length; i++) {
      try { handlers[i](e); } catch (err) { console.error(err); }
    }
  }

  function joystick(speler) {
    var t = toetsJoy[speler], x = 0, y = 0;
    if (t.links) x -= 1; if (t.rechts) x += 1; if (t.boven) y -= 1; if (t.onder) y += 1;
    var m = midiJoy[speler];
    if (Math.abs(m.x) > Math.abs(x)) x = m.x;
    if (Math.abs(m.y) > Math.abs(y)) y = m.y;
    return { x: x, y: y };
  }

  function richtingVan(v) {
    var drempel = 0.5;
    if (Math.max(Math.abs(v.x), Math.abs(v.y)) < drempel) return null;
    if (Math.abs(v.x) >= Math.abs(v.y)) return v.x < 0 ? 'links' : 'rechts';
    return v.y < 0 ? 'boven' : 'onder';
  }

  // Richting-gebeurtenissen: één keer bij duwen, daarna herhalen zolang je vasthoudt.
  var EERSTE_HERHALING = 420, HERHALING = 230;
  function tik(nu, bron) {
    for (var s = 1; s <= 4; s++) {
      var r = richtingVan(joystick(s)), h = herhaal[s];
      if (!r) { herhaal[s] = null; continue; }
      if (!h || h.richting !== r) {
        herhaal[s] = { richting: r, volgende: nu + EERSTE_HERHALING };
        emit({ speler: s, type: 'joystick', richting: r, bron: bron || 'toetsenbord', herhaling: false });
      } else if (nu >= h.volgende) {
        h.volgende = nu + HERHALING;
        emit({ speler: s, type: 'joystick', richting: r, bron: bron || 'toetsenbord', herhaling: true });
      }
    }
  }
  function lus(nu) { tik(nu); requestAnimationFrame(lus); }
  requestAnimationFrame(lus);

  function inTekstveld(t) {
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  }

  function toetsGebeurtenis(ev, ingedrukt) {
    if (inTekstveld(ev.target)) return;
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = codeNaar[ev.code];
    if (!k) return;
    ev.preventDefault();
    var s = k.speler, f = k.functie;
    if (f === 'boven' || f === 'onder' || f === 'links' || f === 'rechts') {
      toetsJoy[s][f] = ingedrukt;
      if (ingedrukt && !ev.repeat) tik(performance.now(), 'toetsenbord');
      return;
    }
    if (f.indexOf('knop') === 0 && f.indexOf('Druk') < 0) {
      if (!ingedrukt) return; // draaien: elke toetsaanslag (ook herhaling) is één stap
      emit({ speler: s, type: 'knop', welke: f.indexOf('Links') > 0 ? 'links' : 'rechts',
             stap: /Plus$/.test(f) ? 1 : -1, bron: 'toetsenbord' });
      return;
    }
    if (ev.repeat) return;
    if (f === 'druk') emit({ speler: s, type: 'joystick-druk', ingedrukt: ingedrukt, bron: 'toetsenbord' });
    else if (f === 'knopRechtsDruk') emit({ speler: s, type: 'knop-druk', welke: 'rechts', ingedrukt: ingedrukt, bron: 'toetsenbord' });
    else if (f === 'toets1') emit({ speler: s, type: 'toets', nr: 1, ingedrukt: ingedrukt, bron: 'toetsenbord' });
    else if (f === 'toets2') emit({ speler: s, type: 'toets', nr: 2, ingedrukt: ingedrukt, bron: 'toetsenbord' });
  }
  window.addEventListener('keydown', function (e) { toetsGebeurtenis(e, true); });
  window.addEventListener('keyup', function (e) { toetsGebeurtenis(e, false); });
  window.addEventListener('blur', function () {
    for (var s = 1; s <= 4; s++) toetsJoy[s] = {};
  });

  // ---------- USB-MIDI (Chrome) ----------
  function relatief(v) { return v === 0 || v === 64 ? 0 : (v < 64 ? v : -(128 - v)); }

  function midiBericht(msg) {
    var d = msg.data, cmd = d[0] & 0xf0, s = (d[0] & 0x0f) + 1;
    if (s < 1 || s > 4) return;
    if (cmd === 0xb0) {
      var cc = d[1], v = d[2];
      if (cc === 1) { midiJoy[s].x = (v - 64) / 63; tik(performance.now(), 'midi'); }
      else if (cc === 2) { midiJoy[s].y = (v - 64) / 63; tik(performance.now(), 'midi'); }
      else if (cc === 10 || cc === 11) {
        var n = relatief(v), welke = cc === 10 ? 'links' : 'rechts';
        for (var i = 0; i < Math.abs(n); i++) emit({ speler: s, type: 'knop', welke: welke, stap: n > 0 ? 1 : -1, bron: 'midi' });
      }
    } else if (cmd === 0x90 || cmd === 0x80) {
      var ingedrukt = cmd === 0x90 && d[2] > 0, noot = d[1];
      if (noot === 60) emit({ speler: s, type: 'joystick-druk', ingedrukt: ingedrukt, bron: 'midi' });
      else if (noot === 61) emit({ speler: s, type: 'knop-druk', welke: 'links', ingedrukt: ingedrukt, bron: 'midi' });
      else if (noot === 62) emit({ speler: s, type: 'knop-druk', welke: 'rechts', ingedrukt: ingedrukt, bron: 'midi' });
      else if (noot === 63) emit({ speler: s, type: 'toets', nr: 1, ingedrukt: ingedrukt, bron: 'midi' });
      else if (noot === 64) emit({ speler: s, type: 'toets', nr: 2, ingedrukt: ingedrukt, bron: 'midi' });
    }
  }

  function zetStatus(midi, n) {
    status = { midi: midi, kastjes: n };
    statusHandlers.forEach(function (fn) { try { fn(status); } catch (e) {} });
  }

  function koppelMidi(access) {
    function verbind() {
      var n = 0;
      access.inputs.forEach(function (inp) { inp.onmidimessage = midiBericht; n++; });
      midiOut = [];
      access.outputs.forEach(function (o) { midiOut.push(o); });
      zetStatus('aan', n);
      // leds opnieuw zetten na in- of uitpluggen
      Object.keys(ledKleur).forEach(function (s) { stuurLed(+s, ledKleur[s]); });
    }
    access.onstatechange = verbind;
    verbind();
  }

  if (navigator.requestMIDIAccess) {
    try {
      navigator.requestMIDIAccess({ sysex: false }).then(koppelMidi, function () { zetStatus('geblokkeerd', 0); });
    } catch (e) { zetStatus('geblokkeerd', 0); }
  } else {
    zetStatus('geen', 0);
  }

  // ---------- ledstrip ----------
  var ledKleur = {};
  function hexNaarRgb(hex) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function stuurLed(s, kleur) {
    if (!midiOut.length) return;
    var rgb = kleur ? hexNaarRgb(kleur) : [0, 0, 0], ch = s - 1;
    midiOut.forEach(function (o) {
      try {
        o.send([0xb0 | ch, 20, rgb[0] >> 1]);
        o.send([0xb0 | ch, 21, rgb[1] >> 1]);
        o.send([0xb0 | ch, 22, rgb[2] >> 1]);
      } catch (e) {}
    });
  }

  window.Kastjes = {
    on: function (fn) { handlers.push(fn); },
    joystick: joystick,
    led: function (speler, kleur) {
      if (ledKleur[speler] === kleur) return;
      ledKleur[speler] = kleur;
      stuurLed(speler, kleur);
      ledHandlers.forEach(function (fn) { try { fn(speler, kleur); } catch (e) {} });
    },
    onLed: function (fn) { ledHandlers.push(fn); },
    onStatus: function (fn) { statusHandlers.push(fn); fn(status); },
    toetsen: TOETSEN
  };
})();
</script>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('doek'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  // tweede laag: het blijvende kunstwerk; de cursors tekenen we er los overheen
  var art=document.createElement('canvas'), actx=art.getContext('2d');
  function maat(){
    var oud=document.createElement('canvas'); oud.width=art.width; oud.height=art.height; if(art.width) oud.getContext('2d').drawImage(art,0,0);
    W=innerWidth; H=innerHeight;
    cv.width=art.width=W*DPR; cv.height=art.height=H*DPR;
    actx.setTransform(DPR,0,0,DPR,0,0); actx.fillStyle='#07080b'; actx.fillRect(0,0,W,H);
    if(oud.width) actx.drawImage(oud,0,0,oud.width/DPR,oud.height/DPR,0,0,W,H);
  }
  addEventListener('resize',maat); maat();

  var SYMS=[1,2,4,6,8,12], symI=4;
  var PENSELEN=['lijn','stippen','sterren','linten'];
  var NAMEN={1:'Speler 1',2:'Speler 2',3:'Speler 3',4:'Speler 4'};
  var START_HUE={1:200,2:330,3:45,4:140};
  var spelers={};
  for(var s=1;s<=4;s++){
    spelers[s]={x:W/2+(s%2?-1:1)*W*0.12, y:H/2+(s<3?-1:1)*H*0.12, vx:0, vy:0, hue:START_HUE[s], grootte:6, pen:false,
      penseel:0, px:null, py:null, actief:false, laatst:0, t2:0, t:Math.random()*10};
  }
  function kleur(p,a){ return 'hsla('+p.hue+',95%,62%,'+(a==null?1:a)+')'; }
  function hex(p){ // hsl -> hex voor de ledstrip
    var h=p.hue/360, s=0.95, l=0.5, q=l<.5?l*(1+s):l+s-l*s, pp=2*l-q;
    function f(t){ t=(t+1)%1; return t<1/6?pp+(q-pp)*6*t:t<.5?q:t<2/3?pp+(q-pp)*(2/3-t)*6:pp; }
    return '#'+[f(h+1/3),f(h),f(h-1/3)].map(function(v){ return ('0'+Math.round(v*255).toString(16)).slice(-2); }).join('');
  }
  function led(s){ Kastjes.led(s, hex(spelers[s])); }
  function hud(s){
    var p=spelers[s], el=document.getElementById('h'+s);
    el.innerHTML='<div class="top"><div class="sw" style="background:'+kleur(p)+';box-shadow:0 0 14px '+kleur(p,.7)+'"></div><div><div class="nm">'+NAMEN[s]+'</div><div class="st">'+(p.actief?(p.pen?'● tekent':'○ pen omhoog'):'wacht op kastje')+'</div></div></div>'+
      '<div class="row"><span>penseel</span><b>'+PENSELEN[p.penseel]+'</b></div><div class="row"><span>grootte</span><b>'+p.grootte+'</b></div>';
    el.classList.toggle('weg',!p.actief);
  }
  for(s=1;s<=4;s++){ hud(s); led(s); }
  function zetSym(){ document.getElementById('sym').textContent=SYMS[symI]; }

  function wek(s){ var p=spelers[s]; p.laatst=performance.now(); if(!p.actief){ p.actief=true; hud(s); } }

  Kastjes.on(function(e){
    var p=spelers[e.speler]; if(!p) return; wek(e.speler);
    if(e.type==='joystick-druk' && e.ingedrukt){ p.pen=!p.pen; p.px=p.py=null; hud(e.speler); }
    else if(e.type==='knop'){
      if(e.welke==='links'){ p.grootte=Math.max(1,Math.min(40,p.grootte+e.stap)); }
      else { p.hue=(p.hue+e.stap*6+360)%360; led(e.speler); }
      hud(e.speler);
    }
    else if(e.type==='knop-druk' && e.ingedrukt && e.welke==='links'){ p.penseel=(p.penseel+1)%PENSELEN.length; hud(e.speler); }
    else if(e.type==='knop-druk' && e.ingedrukt && e.welke==='rechts'){ p.hue=(p.hue+180)%360; led(e.speler); hud(e.speler); }
    else if(e.type==='toets' && e.nr===1 && e.ingedrukt){ symI=(symI+1)%SYMS.length; zetSym(); }
    else if(e.type==='toets' && e.nr===2){ p.t2 = e.ingedrukt ? performance.now() : 0; }
  });
  addEventListener('keydown',function(e){
    if(e.code==='KeyS' && e.shiftKey){ // Shift+S om niet te botsen met speler 1 (S = joystick onder)
      var a=document.createElement('a'); a.download='caleidoscoop-'+Date.now()+'.png'; a.href=art.toDataURL('image/png'); a.click();
    }
  });

  // ---- tekenen met spiegels ----
  function spiegel(fn){
    var n=SYMS[symI], cx=W/2, cy=H/2;
    for(var i=0;i<n;i++){
      actx.save(); actx.translate(cx,cy); actx.rotate(i*2*Math.PI/n);
      if(n>1 && i%2===1) actx.scale(1,-1);
      actx.translate(-cx,-cy); fn(); actx.restore();
    }
    if(n===1){ /* al getekend */ }
  }
  function ster(x,y,r){
    actx.beginPath();
    for(var k=0;k<10;k++){ var a=k*Math.PI/5-Math.PI/2, rr=k%2?r*.45:r; actx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); }
    actx.closePath(); actx.fill();
  }
  function verf(p){
    var x=p.x,y=p.y, sz=p.grootte;
    actx.globalCompositeOperation='lighter';
    actx.strokeStyle=kleur(p,.55); actx.fillStyle=kleur(p,.5); actx.lineCap='round'; actx.lineJoin='round';
    actx.shadowColor=kleur(p,.9); actx.shadowBlur=sz*1.5;
    var mode=PENSELEN[p.penseel];
    if(mode==='lijn'){
      if(p.px==null){ p.px=x; p.py=y; }
      var ax=p.px, ay=p.py;
      spiegel(function(){ actx.lineWidth=sz; actx.beginPath(); actx.moveTo(ax,ay); actx.lineTo(x,y); actx.stroke(); });
    } else if(mode==='stippen'){
      if(p.px!=null && Math.hypot(x-p.px,y-p.py)<sz*2.2) return;
      spiegel(function(){ actx.beginPath(); actx.arc(x,y,sz*.8,0,7); actx.fill(); });
    } else if(mode==='sterren'){
      if(p.px!=null && Math.hypot(x-p.px,y-p.py)<sz*3) return;
      spiegel(function(){ ster(x,y,sz*1.3); });
    } else { // linten: golvende dubbele lijn
      if(p.px==null){ p.px=x; p.py=y; }
      var bx=p.px, by=p.py, dx=x-bx, dy=y-by, l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l, g=Math.sin(p.t*3)*sz*1.6;
      spiegel(function(){ actx.lineWidth=Math.max(1,sz/3);
        actx.beginPath(); actx.moveTo(bx+nx*g,by+ny*g); actx.lineTo(x+nx*g,y+ny*g); actx.stroke();
        actx.beginPath(); actx.moveTo(bx-nx*g,by-ny*g); actx.lineTo(x-nx*g,y-ny*g); actx.stroke(); });
    }
    p.px=x; p.py=y;
    actx.shadowBlur=0; actx.globalCompositeOperation='source-over';
  }

  var vorige=performance.now();
  function frame(nu){
    var dt=Math.min(0.05,(nu-vorige)/1000); vorige=nu;
    for(var s=1;s<=4;s++){
      var p=spelers[s], j=Kastjes.joystick(s);
      if(Math.abs(j.x)>0.05||Math.abs(j.y)>0.05) wek(s);
      var snel=Math.min(W,H)*0.55; // pixels per seconde bij volle uitslag
      p.vx += (j.x*snel - p.vx)*Math.min(1,dt*10); p.vy += (j.y*snel - p.vy)*Math.min(1,dt*10);
      p.x=Math.max(0,Math.min(W,p.x+p.vx*dt)); p.y=Math.max(0,Math.min(H,p.y+p.vy*dt)); p.t+=dt;
      if(p.pen && (Math.abs(p.vx)+Math.abs(p.vy)>4)) verf(p);
      if(p.t2 && nu-p.t2>2000){ p.t2=0; leeg(); }
    }
    ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(art,0,0);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    for(s=1;s<=4;s++){
      p=spelers[s]; if(!p.actief) continue;
      var r=Math.max(8,p.grootte*.8+6), puls=p.pen?0:Math.sin(nu/250)*2;
      ctx.lineWidth=2.5; ctx.strokeStyle=kleur(p); ctx.fillStyle=p.pen?kleur(p,.9):'transparent';
      ctx.beginPath(); ctx.arc(p.x,p.y,r+puls,0,7); ctx.stroke(); if(p.pen){ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); }
      ctx.font='700 11px ui-monospace,Menlo,monospace'; ctx.fillStyle=kleur(p); ctx.fillText(String(s),p.x+r+4,p.y-r);
      if(p.t2){ var f=Math.min(1,(nu-p.t2)/2000); ctx.beginPath(); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.arc(p.x,p.y,r+8,-Math.PI/2,-Math.PI/2+f*Math.PI*2); ctx.stroke(); }
    }
    requestAnimationFrame(frame);
  }
  function leeg(){
    var stap=0;
    (function vervaag(){ actx.fillStyle='rgba(7,8,11,.18)'; actx.fillRect(0,0,W,H); if(++stap<25) requestAnimationFrame(vervaag); else { actx.fillStyle='#07080b'; actx.fillRect(0,0,W,H); } })();
  }
  zetSym(); requestAnimationFrame(frame);
})();
</script>
