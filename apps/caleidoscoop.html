<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caleidoscoop</title>
<style>
/* Eén donker doek vol scherm; vier spelershoeken met kleur, grootte en penseel. Bewust alleen donker: licht moet gloeien. */
:root{--bg:#07080b;--ink:#eef0f3;--muted:#8a909a;--panel:#12141acc;--line:#2a2e36;--f:"Helvetica Neue",Helvetica,Arial,sans-serif;--m:ui-monospace,Menlo,monospace;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--f);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;backdrop-filter:blur(6px);display:grid;gap:6px;transition:opacity .3s}
.hud.weg{display:none}
.hud .top{display:flex;align-items:center;gap:10px}
.hud .sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff3;flex:none}
.hud .nm{font-weight:800;font-size:16px}
.hud .st{font:600 11px var(--m);color:var(--muted)}
.hud .row{display:flex;justify-content:space-between;font:500 12px var(--m)}
.hud .row b{color:var(--ink)}
#h1{top:14px;left:14px}#h2{top:14px;right:14px}#h3{bottom:14px;left:14px}#h4{bottom:14px;right:14px}
#mid{position:fixed;left:50%;top:14px;transform:translateX(-50%);text-align:center;font:700 13px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px}
#help{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(620px,calc(100% - 520px));font-size:12.5px;color:var(--muted);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
@media (max-width:1100px){#help{display:none}}
#help b{color:var(--ink)}
</style>
</head>
<body>
<canvas id="doek"></canvas>
<div id="mid">Caleidoscoop · <span id="sym">8</span> spiegels</div>
<div class="hud" id="h1"></div><div class="hud" id="h2"></div><div class="hud" id="h3"></div><div class="hud" id="h4"></div>
<div id="help"><b>Joystick</b> bewegen · <b>indrukken</b> pen op/neer · <b>knop links</b> grootte (indrukken: penseel) · <b>knop rechts</b> kleur · <b>toets 1</b> aantal spiegels · <b>toets 2</b> 2 sec vasthouden: doek leeg · <b>Shift+S</b>: opslaan als plaatje</div>
<script src="../kastjes.js"></script>
<script>
(function(){
  'use strict';
  var cv=document.getElementById('doek'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);
  // tweede laag: het blijvende kunstwerk; de cursors tekenen we er los overheen
  var art=document.createElement('canvas'), actx=art.getContext('2d');
  function maat(){
    var oud=document.createElement('canvas'); oud.width=art.width; oud.height=art.height; if(art.width) oud.getContext('2d').drawImage(art,0,0);
    W=innerWidth; H=innerHeight;
    cv.width=art.width=W*DPR; cv.height=art.height=H*DPR;
    actx.setTransform(DPR,0,0,DPR,0,0); actx.fillStyle='#07080b'; actx.fillRect(0,0,W,H);
    if(oud.width) actx.drawImage(oud,0,0,oud.width/DPR,oud.height/DPR,0,0,W,H);
  }
  addEventListener('resize',maat); maat();

  var SYMS=[1,2,4,6,8,12], symI=4;
  var PENSELEN=['lijn','stippen','sterren','linten'];
  var NAMEN={1:'Speler 1',2:'Speler 2',3:'Speler 3',4:'Speler 4'};
  var START_HUE={1:200,2:330,3:45,4:140};
  var spelers={};
  for(var s=1;s<=4;s++){
    spelers[s]={x:W/2+(s%2?-1:1)*W*0.12, y:H/2+(s<3?-1:1)*H*0.12, vx:0, vy:0, hue:START_HUE[s], grootte:6, pen:false,
      penseel:0, px:null, py:null, actief:false, laatst:0, t2:0, t:Math.random()*10};
  }
  function kleur(p,a){ return 'hsla('+p.hue+',95%,62%,'+(a==null?1:a)+')'; }
  function hex(p){ // hsl -> hex voor de ledstrip
    var h=p.hue/360, s=0.95, l=0.5, q=l<.5?l*(1+s):l+s-l*s, pp=2*l-q;
    function f(t){ t=(t+1)%1; return t<1/6?pp+(q-pp)*6*t:t<.5?q:t<2/3?pp+(q-pp)*(2/3-t)*6:pp; }
    return '#'+[f(h+1/3),f(h),f(h-1/3)].map(function(v){ return ('0'+Math.round(v*255).toString(16)).slice(-2); }).join('');
  }
  function led(s){ Kastjes.led(s, hex(spelers[s])); }
  function hud(s){
    var p=spelers[s], el=document.getElementById('h'+s);
    el.innerHTML='<div class="top"><div class="sw" style="background:'+kleur(p)+';box-shadow:0 0 14px '+kleur(p,.7)+'"></div><div><div class="nm">'+NAMEN[s]+'</div><div class="st">'+(p.actief?(p.pen?'● tekent':'○ pen omhoog'):'wacht op kastje')+'</div></div></div>'+
      '<div class="row"><span>penseel</span><b>'+PENSELEN[p.penseel]+'</b></div><div class="row"><span>grootte</span><b>'+p.grootte+'</b></div>';
    el.classList.toggle('weg',!p.actief);
  }
  for(s=1;s<=4;s++){ hud(s); led(s); }
  function zetSym(){ document.getElementById('sym').textContent=SYMS[symI]; }

  function wek(s){ var p=spelers[s]; p.laatst=performance.now(); if(!p.actief){ p.actief=true; hud(s); } }

  Kastjes.on(function(e){
    var p=spelers[e.speler]; if(!p) return; wek(e.speler);
    if(e.type==='joystick-druk' && e.ingedrukt){ p.pen=!p.pen; p.px=p.py=null; hud(e.speler); }
    else if(e.type==='knop'){
      if(e.welke==='links'){ p.grootte=Math.max(1,Math.min(40,p.grootte+e.stap)); }
      else { p.hue=(p.hue+e.stap*6+360)%360; led(e.speler); }
      hud(e.speler);
    }
    else if(e.type==='knop-druk' && e.ingedrukt && e.welke==='links'){ p.penseel=(p.penseel+1)%PENSELEN.length; hud(e.speler); }
    else if(e.type==='knop-druk' && e.ingedrukt && e.welke==='rechts'){ p.hue=(p.hue+180)%360; led(e.speler); hud(e.speler); }
    else if(e.type==='toets' && e.nr===1 && e.ingedrukt){ symI=(symI+1)%SYMS.length; zetSym(); }
    else if(e.type==='toets' && e.nr===2){ p.t2 = e.ingedrukt ? performance.now() : 0; }
  });
  addEventListener('keydown',function(e){
    if(e.code==='KeyS' && e.shiftKey){ // Shift+S om niet te botsen met speler 1 (S = joystick onder)
      var a=document.createElement('a'); a.download='caleidoscoop-'+Date.now()+'.png'; a.href=art.toDataURL('image/png'); a.click();
    }
  });

  // ---- tekenen met spiegels ----
  function spiegel(fn){
    var n=SYMS[symI], cx=W/2, cy=H/2;
    for(var i=0;i<n;i++){
      actx.save(); actx.translate(cx,cy); actx.rotate(i*2*Math.PI/n);
      if(n>1 && i%2===1) actx.scale(1,-1);
      actx.translate(-cx,-cy); fn(); actx.restore();
    }
    if(n===1){ /* al getekend */ }
  }
  function ster(x,y,r){
    actx.beginPath();
    for(var k=0;k<10;k++){ var a=k*Math.PI/5-Math.PI/2, rr=k%2?r*.45:r; actx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); }
    actx.closePath(); actx.fill();
  }
  function verf(p){
    var x=p.x,y=p.y, sz=p.grootte;
    actx.globalCompositeOperation='lighter';
    actx.strokeStyle=kleur(p,.55); actx.fillStyle=kleur(p,.5); actx.lineCap='round'; actx.lineJoin='round';
    actx.shadowColor=kleur(p,.9); actx.shadowBlur=sz*1.5;
    var mode=PENSELEN[p.penseel];
    if(mode==='lijn'){
      if(p.px==null){ p.px=x; p.py=y; }
      var ax=p.px, ay=p.py;
      spiegel(function(){ actx.lineWidth=sz; actx.beginPath(); actx.moveTo(ax,ay); actx.lineTo(x,y); actx.stroke(); });
    } else if(mode==='stippen'){
      if(p.px!=null && Math.hypot(x-p.px,y-p.py)<sz*2.2) return;
      spiegel(function(){ actx.beginPath(); actx.arc(x,y,sz*.8,0,7); actx.fill(); });
    } else if(mode==='sterren'){
      if(p.px!=null && Math.hypot(x-p.px,y-p.py)<sz*3) return;
      spiegel(function(){ ster(x,y,sz*1.3); });
    } else { // linten: golvende dubbele lijn
      if(p.px==null){ p.px=x; p.py=y; }
      var bx=p.px, by=p.py, dx=x-bx, dy=y-by, l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l, g=Math.sin(p.t*3)*sz*1.6;
      spiegel(function(){ actx.lineWidth=Math.max(1,sz/3);
        actx.beginPath(); actx.moveTo(bx+nx*g,by+ny*g); actx.lineTo(x+nx*g,y+ny*g); actx.stroke();
        actx.beginPath(); actx.moveTo(bx-nx*g,by-ny*g); actx.lineTo(x-nx*g,y-ny*g); actx.stroke(); });
    }
    p.px=x; p.py=y;
    actx.shadowBlur=0; actx.globalCompositeOperation='source-over';
  }

  var vorige=performance.now();
  function frame(nu){
    var dt=Math.min(0.05,(nu-vorige)/1000); vorige=nu;
    for(var s=1;s<=4;s++){
      var p=spelers[s], j=Kastjes.joystick(s);
      if(Math.abs(j.x)>0.05||Math.abs(j.y)>0.05) wek(s);
      var snel=Math.min(W,H)*0.55; // pixels per seconde bij volle uitslag
      p.vx += (j.x*snel - p.vx)*Math.min(1,dt*10); p.vy += (j.y*snel - p.vy)*Math.min(1,dt*10);
      p.x=Math.max(0,Math.min(W,p.x+p.vx*dt)); p.y=Math.max(0,Math.min(H,p.y+p.vy*dt)); p.t+=dt;
      if(p.pen && (Math.abs(p.vx)+Math.abs(p.vy)>4)) verf(p);
      if(p.t2 && nu-p.t2>2000){ p.t2=0; leeg(); }
    }
    ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(art,0,0);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    for(s=1;s<=4;s++){
      p=spelers[s]; if(!p.actief) continue;
      var r=Math.max(8,p.grootte*.8+6), puls=p.pen?0:Math.sin(nu/250)*2;
      ctx.lineWidth=2.5; ctx.strokeStyle=kleur(p); ctx.fillStyle=p.pen?kleur(p,.9):'transparent';
      ctx.beginPath(); ctx.arc(p.x,p.y,r+puls,0,7); ctx.stroke(); if(p.pen){ ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); }
      ctx.font='700 11px ui-monospace,Menlo,monospace'; ctx.fillStyle=kleur(p); ctx.fillText(String(s),p.x+r+4,p.y-r);
      if(p.t2){ var f=Math.min(1,(nu-p.t2)/2000); ctx.beginPath(); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.arc(p.x,p.y,r+8,-Math.PI/2,-Math.PI/2+f*Math.PI*2); ctx.stroke(); }
    }
    requestAnimationFrame(frame);
  }
  function leeg(){
    var stap=0;
    (function vervaag(){ actx.fillStyle='rgba(7,8,11,.18)'; actx.fillRect(0,0,W,H); if(++stap<25) requestAnimationFrame(vervaag); else { actx.fillStyle='#07080b'; actx.fillRect(0,0,W,H); } })();
  }
  zetSym(); requestAnimationFrame(frame);
})();
</script>
<script src="../thuis.js"></script>
</body>
</html>
